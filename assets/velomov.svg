<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- VeloMov: a "V" whose left stroke is sliced (the cut) and flung forward (the speed) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1f2e"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="78" y1="64" x2="128" y2="190">
      <stop offset="0" stop-color="#3EF0FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="178" y1="64" x2="128" y2="190">
      <stop offset="0" stop-color="#FF63B0"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#3EF0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#3EF0FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="above-cut"><path d="M-41 169.4 L249.4 64.3 L249.4 -50 L-41 -50 Z"/></clipPath>
    <clipPath id="below-cut"><path d="M-41 169.4 L249.4 64.3 L249.4 300 L-41 300 Z"/></clipPath>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#glow)"/>
  <g opacity="0.5" filter="url(#soft)">
    <path d="M78 70 L128 186" stroke="#2fd0ff" stroke-width="30" stroke-linecap="round"/>
    <path d="M178 70 L128 186" stroke="#b45cf6" stroke-width="30" stroke-linecap="round"/>
  </g>
  <path d="M30 84 L50 84" stroke="url(#streak)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <path d="M22 100 L54 100" stroke="url(#streak)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M178 70 L128 186" stroke="url(#right)" stroke-width="34" stroke-linecap="round"/>
  <g clip-path="url(#below-cut)">
    <path d="M78 70 L128 186" stroke="url(#left)" stroke-width="34" stroke-linecap="round"/>
  </g>
  <g transform="translate(-9 -3.5)">
    <g clip-path="url(#above-cut)">
      <path d="M78 70 L128 186" stroke="url(#left)" stroke-width="34" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="59.25" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
</svg>
