[package]
name = "velomov"
version = "0.8.0"
edition = "2021"
description = "VeloMov - a lightweight video editor for Linux and Windows (GPU compositing, keyframes, transitions with motion blur)"
license = "GPL-3.0-or-later"
repository = "https://github.com/velomov/velomov"
readme = "README.md"
keywords = ["video", "editor", "transitions", "wgpu", "ffmpeg"]
categories = ["multimedia::video"]
default-run = "velomov"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui-phosphor = { version = "0.9.0", default-features = false, features = ["regular", "fill"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15.3"
libc = "0.2"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tiny-skia = "0.11.4"
cosmic-text = "0.12.1"
rfd = "0.15"
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["x11"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
